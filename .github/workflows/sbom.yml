name: sbom

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.69.2
      - name: Generate SPDX SBOM
        run: trivy fs --format spdx-json --output sbom.spdx.json .

      - name: Generate CycloneDX SBOM
        run: trivy fs --format cyclonedx --output sbom.cyclonedx.json .

      - name: Upload SPDX as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx-json
          path: sbom.spdx.json

      - name: Upload CycloneDX as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx-json
          path: sbom.cyclonedx.json

      - name: Attach SBOMs to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --generate-notes --target master || true
          gh release upload "${GITHUB_REF_NAME}" sbom.spdx.json sbom.cyclonedx.json --clobber
