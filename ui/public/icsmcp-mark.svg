<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>ICS MCP calendar workspace</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B6850"/>
      <stop offset="1" stop-color="#2A4A38"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="18" x2="0" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFEF9"/>
      <stop offset="1" stop-color="#F5F1E8"/>
    </linearGradient>
    <linearGradient id="spark" x1="44" y1="12" x2="56" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8D058"/>
      <stop offset="1" stop-color="#E8A830"/>
    </linearGradient>
    <filter id="shadow" x="-4" y="-2" width="36" height="40" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feOffset dy="2" in="b" result="o"/>
      <feFlood flood-color="#1A2E22" flood-opacity="0.18"/>
      <feComposite in2="o" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
